<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>팻</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; }
      #pet { font-size: 28px; text-align: center; padding: 12px 0 20px; }
      .gauge { margin-bottom: 14px; }
      .gauge-head {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        margin-bottom: 4px;
      }
      .gauge-track {
        height: 12px;
        background: #e5e7eb;
        border-radius: 6px;
        overflow: hidden;
      }
      .gauge-fill {
        height: 100%;
        width: 0%;
        border-radius: 6px;
        transition: width 0.25s ease;
      }
      #hunger-fill { background: #ef4444; }
      #happy-fill { background: #22c55e; }
      #feed {
        display: block;
        width: 100%;
        padding: 10px;
        font-size: 15px;
        cursor: pointer;
        margin-top: 8px;
      }
      .status-card {
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 10px;
        margin: 14px 0;
        background: #f9fafb;
        font-size: 13px;
      }
      .status-row {
        display: flex;
        justify-content: space-between;
        margin: 4px 0;
      }
      #chat-form { display: flex; gap: 6px; margin-top: 12px; }
      #chat-input {
        flex: 1;
        min-width: 0;
        padding: 9px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
      }
      #chat-submit {
        padding: 9px 10px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        cursor: pointer;
      }
      #chat-reply {
        min-height: 18px;
        margin-top: 8px;
        font-size: 13px;
        color: #374151;
      }
    </style>
  </head>
  <body>
    <div id="pet">🐾</div>

    <div class="gauge">
      <div class="gauge-head">
        <span>배고픔</span>
        <span><span id="hunger-val">0</span> / 100</span>
      </div>
      <div class="gauge-track" role="progressbar" aria-label="배고픔" aria-valuemin="0" aria-valuemax="100">
        <div id="hunger-fill" class="gauge-fill"></div>
      </div>
    </div>

    <div class="gauge">
      <div class="gauge-head">
        <span>행복</span>
        <span><span id="happy-val">100</span> / 100</span>
      </div>
      <div class="gauge-track" role="progressbar" aria-label="행복" aria-valuemin="0" aria-valuemax="100">
        <div id="happy-fill" class="gauge-fill"></div>
      </div>
    </div>

    <button id="feed">먹이 주기</button>

    <section class="status-card" aria-label="성장 상태">
      <div class="status-row"><span>레벨</span><strong id="level-val">1</strong></div>
      <div class="status-row"><span>친밀도</span><strong><span id="bond-val">0</span> / 100</strong></div>
      <div class="status-row"><span>경험치</span><strong id="xp-val">0 XP</strong></div>
      <div class="status-row"><span>대화</span><strong><span id="chat-count-val">0</span>회</strong></div>
    </section>

    <form id="chat-form">
      <input id="chat-input" type="text" maxlength="80" placeholder="팻에게 말 걸기" aria-label="팻에게 말 걸기" />
      <button id="chat-submit" type="submit">대화</button>
    </form>
    <div id="chat-reply" role="status" aria-live="polite">말을 걸면 친밀도와 경험치가 올라요.</div>
    <script src="./sidepanel.js"></script>
  </body>
</html>
